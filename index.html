<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>YASIR'S TEMPLE RUNNER</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background: #111411;
      font-family: 'Courier New', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 420px;
      max-width: 96vw;
      background: #000;
      border: 4px solid #5a4225;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 170, 0, 0.3);
    }

    .game-window-bar {
      background: #eee8d5;
      color: #2b251a;
      font-weight: bold;
      font-size: 13px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #233b1e;
    }

    .controls-overlay {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }

    .dpad, .action-buttons {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn {
      width: 48px;
      height: 48px;
      background: rgba(30, 30, 30, 0.85);
      border: 3px solid #888;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #111;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #111;
    }

    .btn-action {
      border-radius: 50%;
      font-size: 15px;
      width: 52px;
      height: 52px;
    }

    .btn-jump { background: #2e7d32; border-color: #66bb6a; }
    .btn-slide { background: #c62828; border-color: #ef5350; }

    .help-text {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="game-window-bar">
      <span>👑 YASIR'S TEMPLE RUNNER</span>
      <span>🗕 🗖 ✖</span>
    </div>

    <canvas id="gameCanvas" width="420" height="540"></canvas>

    <div class="controls-overlay">
      <div class="dpad">
        <button class="btn" id="btn-left">◀</button>
        <button class="btn" id="btn-right">▶</button>
      </div>
      <div class="action-buttons">
        <button class="btn btn-action btn-jump" id="btn-jump">A<br><span style="font-size:9px;">JUMP</span></button>
        <button class="btn btn-action btn-slide" id="btn-slide">B<br><span style="font-size:9px;">SLIDE</span></button>
      </div>
    </div>
  </div>

  <p class="help-text">Keyboard: <b>A / D</b> (Lanes) | <b>W / SPACE</b> (Jump) | <b>S</b> (Slide)</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Load photo
    const userImg = new Image();
    userImg.src = "yasir.png";

    // Retro Audio
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const soundCoin = () => playTone(950, "square", 0.1);
    const soundJump = () => playTone(360, "sine", 0.15);
    const soundCrash = () => playTone(110, "sawtooth", 0.3);

    let score = 0;
    let coins = 0;
    let health = 100;
    let gameOver = false;
    let gameSpeed = 5;
    let frame = 0;

    const lanesX = [-85, 0, 85];

    const player = {
      lane: 0,
      targetX: 210,
      x: 210,
      y: 420,
      jumpY: 0,
      isJumping: false,
      isSliding: false,
      jumpSpeed: 0,
      gravity: 0.85,
      slideTimer: 0
    };

    let obstacles = [];
    let coinItems = [];

    function spawnElements() {
      const chosenLane = Math.floor(Math.random() * 3) - 1;
      const typeRand = Math.random();

      if (typeRand < 0.45) {
        obstacles.push({ type: 'log', lane: chosenLane, z: 0.1, passed: false });
      } else if (typeRand < 0.75) {
        obstacles.push({ type: 'boulder', lane: chosenLane, z: 0.1, passed: false });
      } else {
        obstacles.push({ type: 'spikes', lane: chosenLane, z: 0.1, passed: false });
      }

      const coinLane = (chosenLane + 1) % 3 - 1;
      for (let i = 0; i < 3; i++) {
        coinItems.push({ lane: coinLane, z: 0.1 - (i * 0.04), collected: false });
      }
    }

    function moveLeft() {
      if (player.lane > -1) {
        player.lane--;
        player.targetX = 210 + lanesX[player.lane + 1];
      }
    }

    function moveRight() {
      if (player.lane < 1) {
        player.lane++;
        player.targetX = 210 + lanesX[player.lane + 1];
      }
    }

    function jump() {
      if (!player.isJumping && !player.isSliding) {
        player.isJumping = true;
        player.jumpSpeed = -13;
        soundJump();
      }
    }

    function slide() {
      if (!player.isJumping) {
        player.isSliding = true;
        player.slideTimer = 22;
      }
    }

    function restartGame() {
      score = 0;
      coins = 0;
      health = 100;
      gameOver = false;
      obstacles = [];
      coinItems = [];
      player.lane = 0;
      player.x = 210;
      player.targetX = 210;
      player.jumpY = 0;
      player.isJumping = false;
      player.isSliding = false;
    }

    window.addEventListener("keydown", (e) => {
      if (gameOver) {
        if (e.code === "Space" || e.key === "Enter") restartGame();
        return;
      }
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") moveLeft();
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") moveRight();
      if (e.key === "w" || e.key === "W" || e.key === " " || e.key === "ArrowUp") jump();
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") slide();
    });

    document.getElementById("btn-left").addEventListener("click", () => !gameOver && moveLeft());
    document.getElementById("btn-right").addEventListener("click", () => !gameOver && moveRight());
    document.getElementById("btn-jump").addEventListener("click", () => !gameOver && jump());
    document.getElementById("btn-slide").addEventListener("click", () => !gameOver && slide());
    canvas.addEventListener("click", () => { if (gameOver) restartGame(); });

    function update() {
      if (gameOver) return;

      frame++;
      score += 1;

      player.x += (player.targetX - player.x) * 0.3;

      if (player.isJumping) {
        player.jumpY += player.jumpSpeed;
        player.jumpSpeed += player.gravity;
        if (player.jumpY >= 0) {
          player.jumpY = 0;
          player.isJumping = false;
        }
      }

      if (player.isSliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
      }

      if (frame % 70 === 0) {
        spawnElements();
        if (gameSpeed < 9) gameSpeed += 0.02;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z += (gameSpeed * 0.0022);

        if (obs.z >= 0.78 && obs.z <= 0.95 && !obs.passed) {
          if (obs.lane === player.lane) {
            let hit = true;
            if (obs.type === 'log' && player.isJumping && player.jumpY < -26) hit = false;
            if (obs.type === 'spikes' && player.isJumping && player.jumpY < -20) hit = false;

            if (hit) {
              health -= 35;
              soundCrash();
              obs.passed = true;
              if (health <= 0) {
                health = 0;
                gameOver = true;
              }
            }
          }
        }

        if (obs.z > 1.1) obstacles.splice(i, 1);
      }

      for (let j = coinItems.length - 1; j >= 0; j--) {
        const c = coinItems[j];
        c.z += (gameSpeed * 0.0022);

        if (c.z >= 0.78 && c.z <= 0.95 && !c.collected) {
          if (c.lane === player.lane) {
            c.collected = true;
            coins += 1;
            score += 20;
            soundCoin();
            coinItems.splice(j, 1);
            continue;
          }
        }

        if (c.z > 1.1) coinItems.splice(j, 1);
      }
    }

    function getScreenCoords(lane, z) {
      const scale = z * z;
      const y = 160 + (490 - 160) * scale;
      const x = 210 + (lanesX[lane + 1] * 1.5) * scale;
      return { x, y, scale };
    }

    // Function to draw animated running Cartoon Jungle Monsters
    function drawCartoonMonster(x, y, isLeft) {
      ctx.save();
      ctx.translate(x, y);
      if (!isLeft) ctx.scale(-1, 1); // Flip face for right side

      const anim = Math.sin(frame * 0.25) * 4;
      const legRun = (Math.floor(frame / 4) % 2 === 0) ? 6 : -6;

      // Furry Body (Temple Goblin / Ape)
      ctx.fillStyle = "#3e2723";
      ctx.beginPath();
      ctx.ellipse(0, -22 + anim, 16, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      // Belly patch
      ctx.fillStyle = "#8d6e63";
      ctx.beginPath();
      ctx.ellipse(2, -18 + anim, 10, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // Big Cartoon Head
      ctx.fillStyle = "#4e342e";
      ctx.beginPath();
      ctx.arc(4, -42 + anim, 15, 0, Math.PI * 2);
      ctx.fill();

      // Glowing Big Yellow Cartoon Eyes
      ctx.fillStyle = "#ffeb3b";
      ctx.beginPath();
      ctx.arc(8, -44 + anim, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d50000"; // Red Pupil
      ctx.beginPath();
      ctx.arc(10, -44 + anim, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Open Mouth with sharp tooth
      ctx.fillStyle = "#212121";
      ctx.beginPath();
      ctx.arc(10, -36 + anim, 4, 0, Math.PI);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(8, -37 + anim, 2, 3);

      // Cute Little Ears / Horns
      ctx.fillStyle = "#ff9800";
      ctx.beginPath();
      ctx.moveTo(-4, -54 + anim);
      ctx.lineTo(2, -48 + anim);
      ctx.lineTo(-8, -46 + anim);
      ctx.fill();

      // Running cartoon arms
      ctx.strokeStyle = "#3e2723";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-6, -26 + anim);
      ctx.lineTo(-14, -16 - anim);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(8, -26 + anim);
      ctx.lineTo(18, -20 + anim);
      ctx.stroke();

      // Running Legs
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-6, -4);
      ctx.lineTo(-10 + legRun, 12);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(6, -4);
      ctx.lineTo(10 - legRun, 12);
      ctx.stroke();

      // Tail
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#3e2723";
      ctx.beginPath();
      ctx.moveTo(-14, -14 + anim);
      ctx.quadraticCurveTo(-26, -24 + anim, -20, -34 + anim);
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      // Jungle Background
      ctx.fillStyle = "#193315";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#2c4c23";
      ctx.fillRect(0, 80, canvas.width, 100);

      // Ancient Ruin
      ctx.fillStyle = "#53634e";
      ctx.fillRect(280, 70, 70, 70);
      ctx.fillRect(295, 50, 40, 20);

      // Jungle Palm Leaves on Side Borders
      ctx.fillStyle = "#1b5e20";
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(0, 180 + (i * 60), 38, 0, Math.PI * 0.7);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(420, 180 + (i * 60), 38, Math.PI * 0.3, Math.PI);
        ctx.fill();
      }

      // Track Road
      ctx.beginPath();
      ctx.moveTo(160, 160);
      ctx.lineTo(260, 160);
      ctx.lineTo(390, 520);
      ctx.lineTo(30, 520);
      ctx.closePath();
      ctx.fillStyle = "#7b7051";
      ctx.fill();
      ctx.strokeStyle = "#4d422a";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Lane Lines
      ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(195, 160); ctx.lineTo(150, 520);
      ctx.moveTo(225, 160); ctx.lineTo(270, 520);
      ctx.stroke();

      // Depth sorted items
      const renderList = [
        ...obstacles.map(o => ({ ...o, isObs: true })),
        ...coinItems.map(c => ({ ...c, isObs: false }))
      ].sort((a, b) => a.z - b.z);

      for (let item of renderList) {
        const pt = getScreenCoords(item.lane, item.z);
        const s = pt.scale;

        if (item.isObs) {
          if (item.type === 'boulder') {
            ctx.fillStyle = "#555";
            ctx.beginPath();
            ctx.arc(pt.x, pt.y - (18 * s), 22 * s, 0, Math.PI * 2);
            ctx.fill();
          } else if (item.type === 'log') {
            ctx.fillStyle = "#5c3a21";
            ctx.fillRect(pt.x - (32 * s), pt.y - (14 * s), 64 * s, 14 * s);
            ctx.fillStyle = "#3e2411";
            ctx.fillRect(pt.x - (28 * s), pt.y - (10 * s), 56 * s, 4 * s);
          } else if (item.type === 'spikes') {
            ctx.fillStyle = "#888";
            for (let k = -2; k <= 2; k++) {
              ctx.beginPath();
              ctx.moveTo(pt.x + (k * 10 * s), pt.y);
              ctx.lineTo(pt.x + (k * 10 * s) + (5 * s), pt.y - (20 * s));
              ctx.lineTo(pt.x + (k * 10 * s) + (10 * s), pt.y);
              ctx.fill();
            }
          }
        } else {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y - (15 * s), 12 * s, 0, Math.PI * 2);
          ctx.fillStyle = "#facc15";
          ctx.fill();
          ctx.strokeStyle = "#ca8a04";
          ctx.lineWidth = 2 * s;
          ctx.stroke();
        }
      }

      // --- ANIMATED CARTOONS ON SIDES ---
      // Left Side Running Monkey Cartoon
      const leftY = 360 + Math.sin(frame * 0.1) * 20;
      drawCartoonMonster(34, leftY, true);

      // Right Side Running Ape Cartoon
      const rightY = 400 + Math.cos(frame * 0.12) * 18;
      drawCartoonMonster(386, rightY, false);

      // --- DRAW YASIR PHOTO AVATAR ON TRACK ---
      ctx.save();
      const pY = player.y + player.jumpY;
      ctx.translate(player.x, pY);

      if (player.isSliding) {
        ctx.scale(1, 0.45);
      }

      ctx.fillStyle = "#ff9800";
      ctx.beginPath();
      ctx.arc(0, -32, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, -32, 25, 0, Math.PI * 2);
      ctx.clip();
      if (userImg.complete && userImg.naturalHeight !== 0) {
        ctx.drawImage(userImg, -25, -57, 50, 50);
      } else {
        ctx.fillStyle = "#333";
        ctx.fillRect(-25, -57, 50, 50);
      }
      ctx.restore();

      ctx.fillStyle = "#ede8d0";
      ctx.fillRect(-14, -8, 28, 16);
      ctx.fillStyle = "#1e3a8a";
      const legRun = (Math.floor(frame / 6) % 2 === 0) ? 4 : -4;
      ctx.fillRect(-12, 8, 10, 14 + (player.isJumping ? 0 : legRun));
      ctx.fillRect(2, 8, 10, 14 - (player.isJumping ? 0 : legRun));

      ctx.restore();

      // --- HUD PROFILE & SCORE ---
      ctx.fillStyle = "#1e291e";
      ctx.fillRect(10, 10, 48, 52);
      ctx.strokeStyle = "#ff9800";
      ctx.lineWidth = 2;
      ctx.strokeRect(10, 10, 48, 52);

      if (userImg.complete && userImg.naturalHeight !== 0) {
        ctx.drawImage(userImg, 12, 12, 44, 38);
      }

      ctx.fillStyle = "#000";
      ctx.fillRect(10, 50, 48, 12);
      ctx.fillStyle = "#ffd54f";
      ctx.font = "bold 9px sans-serif";
      ctx.fillText("YASIR", 18, 59);

      // Health Bar
      ctx.fillStyle = "#333";
      ctx.fillRect(66, 14, 110, 14);
      ctx.fillStyle = health > 30 ? "#4caf50" : "#e53935";
      ctx.fillRect(68, 16, (health / 100) * 106, 10);

      // Score & Coins
      ctx.fillStyle = "#ffd54f";
      ctx.font = "bold 15px sans-serif";
      ctx.fillText("● COINS: " + coins, 195, 26);
      ctx.fillStyle = "#fff";
      ctx.fillText("SCORE: " + score, 310, 26);

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ef5350";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("GAME OVER!", 125, 210);

        ctx.fillStyle = "#ffd54f";
        ctx.font = "18px sans-serif";
        ctx.fillText("Runner: YASIR", 145, 250);

        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText("Final Score: " + score, 140, 280);
        ctx.fillText("Coins: " + coins, 170, 310);

        ctx.fillStyle = "#4caf50";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText("TAP OR SPACE TO PLAY AGAIN", 85, 360);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
